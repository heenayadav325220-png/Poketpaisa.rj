<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE AI - Premium Robot Simulator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: radial-gradient(circle at center,#1a1a1a,#050505);
    font-family:Segoe UI,sans-serif;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    overflow:hidden;
}

h1{
    color:#00ffcc;
    margin-bottom:25px;
    text-shadow:0 0 15px #00ffcc;
    letter-spacing:2px;
}

.robot-screen{
    width:320px;
    height:240px;
    background:#000;
    border:4px solid #00ffcc;
    border-radius:25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;

    box-shadow:
    0 0 20px #00ffcc,
    0 0 40px rgba(0,255,204,.5),
    0 0 80px rgba(0,255,204,.2);

    animation:floatRobot 4s ease-in-out infinite;
}

@keyframes floatRobot{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

.eyes-container{
    display:flex;
    gap:50px;
}

.eye{
    width:50px;
    height:50px;
    border-radius:50%;
    background:#00ffcc;

    box-shadow:
    0 0 15px #00ffcc,
    0 0 30px #00ffcc,
    0 0 50px #00ffcc;

    animation:blink 5s infinite;
    transition:.3s;
}

@keyframes blink{
    0%,95%,100%{
        transform:scaleY(1);
    }
    97%{
        transform:scaleY(.1);
    }
}

.status{
    margin-top:20px;
    color:#00ffcc;
    font-weight:bold;
    text-align:center;
    padding:0 10px;
}

.thinking{
    width:180px;
    height:6px;
    border-radius:20px;
    background:#222;
    margin-top:15px;
    overflow:hidden;
}

.thinking span{
    display:block;
    width:40%;
    height:100%;
    background:#00ffcc;
    animation:loading 2s linear infinite;
}

@keyframes loading{
    0%{
        transform:translateX(-100%);
    }
    100%{
        transform:translateX(400%);
    }
}

.controls{
    margin-top:25px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:linear-gradient(135deg,#1f1f1f,#2f2f2f);
    color:white;
    transition:.3s;
}

button:hover{
    background:#00ffcc;
    color:black;
    transform:scale(1.05);
}

.footer{
    margin-top:20px;
    color:#888;
    font-size:13px;
}
</style>
</head>

<body>

<h1>CORE AI</h1>

<div class="robot-screen">

    <div class="eyes-container">
        <div class="eye" id="leftEye"></div>
        <div class="eye" id="rightEye"></div>
    </div>

    <div class="status" id="status">
        CORE AI Ready 🤖
    </div>

    <div class="thinking">
        <span></span>
    </div>

</div>

<div class="controls">
    <button onclick="changeMood('happy')">👋 Hello</button>
    <button onclick="changeMood('dance')">🕺 Dance</button>
    <button onclick="changeMood('angry')">😡 Angry</button>
    <button onclick="changeMood('think')">🧠 Think</button>
    <button onclick="changeMood('reset')">🔄 Reset</button>
</div>

<div class="footer">
    CORE AI Premium Simulator v2.0
</div>

<script>
const leftEye = document.getElementById("leftEye");
const rightEye = document.getElementById("rightEye");
const statusText = document.getElementById("status");

function speak(text){
    if('speechSynthesis' in window){
        speechSynthesis.cancel();

        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = "hi-IN";
        msg.rate = 1;
        speechSynthesis.speak(msg);
    }
}

function changeMood(mood){

    if(mood === "happy"){
        leftEye.style.background="#00ffcc";
        rightEye.style.background="#00ffcc";

        statusText.innerHTML="CORE AI: नमस्ते मानव 👋";

        speak("नमस्ते मानव");
    }

    else if(mood === "dance"){
        leftEye.style.background="#ff00ff";
        rightEye.style.background="#ff00ff";

        statusText.innerHTML="CORE AI: डांस मोड सक्रिय 🕺";

        speak("डांस मोड सक्रिय");
    }

    else if(mood === "angry"){
        leftEye.style.background="#ff3333";
        rightEye.style.background="#ff3333";

        statusText.innerHTML="CORE AI: चेतावनी मोड 😡";

        speak("चेतावनी मोड");
    }

    else if(mood === "think"){
        leftEye.style.background="#00aaff";
        rightEye.style.background="#00aaff";

        statusText.innerHTML="CORE AI: सोच रहा हूँ... 🧠";

        speak("मैं सोच रहा हूँ");
    }

    else if(mood === "reset"){
        leftEye.style.background="#00ffcc";
        rightEye.style.background="#00ffcc";

        statusText.innerHTML="CORE AI Ready 🤖";

        speak("सिस्टम रीसेट पूर्ण");
    }
}

window.onload=()=>{
    speak("कोर ए आई तैयार है");
};
</script>

</body>
</html>
