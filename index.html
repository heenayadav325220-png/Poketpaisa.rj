<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CorBat AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#121212;
color:#fff;
height:100vh;
display:flex;
flex-direction:column;
justify-content:space-between;
padding:20px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:800;
color:#39FF14;
}

.connection{
display:flex;
align-items:center;
gap:10px;
}

.dot{
width:14px;
height:14px;
border-radius:50%;
background:#ff3333;
box-shadow:0 0 12px #ff3333;
}

.dashboard{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.speedometer{
width:250px;
height:250px;
border-radius:50%;
border:8px solid #39FF14;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
box-shadow:0 0 25px #39FF14;
}

.speed{
font-size:72px;
font-weight:900;
}

.unit{
font-size:22px;
opacity:0.8;
}

.badge{
margin-top:25px;
padding:12px 25px;
border-radius:30px;
font-weight:bold;
background:#1f1f1f;
border:1px solid #39FF14;
}

.bottom-bar{
display:flex;
flex-direction:column;
gap:15px;
}

.btn{
height:58px;
border:none;
border-radius:14px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.download{
background:#39FF14;
color:#000;
}

.share{
background:#1565C0;
color:white;
}

.btn:hover{
transform:scale(1.02);
}
</style>
</head>
<body>

<div class="top-bar">
<div class="logo">CorBat AI</div>

<div class="connection">
<div class="dot" id="statusDot"></div>
<span id="statusText">Searching...</span>
</div>
</div>

<div class="dashboard">

<div class="speedometer">
<div class="speed" id="speed">0</div>
<div class="unit">km/h</div>
</div>

<div class="badge" id="quality">
READY TO HIT
</div>

</div>

<div class="bottom-bar">
<button class="btn download" id="installBtn">
DOWNLOAD CORBAT APP
</button>

<button class="btn share" onclick="shareApp()">
SHARE WITH FRIENDS
</button>
</div>

<script>

// Demo Live Speed Simulation
setInterval(()=>{
let speed=Math.floor(Math.random()*160);

document.getElementById("speed").innerText=speed;

if(speed>110){
document.getElementById("quality").innerText="PERFECT TIMING";
document.getElementById("quality").style.color="#39FF14";
}else{
document.getElementById("quality").innerText="READY TO HIT";
document.getElementById("quality").style.color="#FFFFFF";
}
},1500);

// WhatsApp Share
function shareApp(){
let link=window.location.href;

window.open(
`https://wa.me/?text=Track your bat speed with CorBat AI 🚀 ${link}`,
'_blank'
);
}

// BLE Placeholder
async function connectBluetooth(){
try{
const device = await navigator.bluetooth.requestDevice({
acceptAllDevices:true
});

document.getElementById("statusDot").style.background="#39FF14";
document.getElementById("statusDot").style.boxShadow="0 0 15px #39FF14";
document.getElementById("statusText").innerText="Connected";

}catch(err){
console.log(err);
}
}

// Auto connect on tap
document.getElementById("statusDot")
.addEventListener("click",connectBluetooth);

</script>

</body>
</html>
