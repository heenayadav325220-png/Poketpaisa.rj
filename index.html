<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlterX - AI Alter-Ego Sandbox</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#060b16;
color:white;
height:100vh;
overflow:hidden;
}

.container{
display:flex;
height:100vh;
}

.sidebar{
width:300px;
background:#0b1220;
border-right:1px solid rgba(255,255,255,.08);
padding:20px;
}

.logo{
font-size:28px;
font-weight:700;
margin-bottom:25px;
color:#61dafb;
}

.card{
background:#121b2d;
padding:15px;
border-radius:14px;
margin-bottom:15px;
}

.status-live{
color:#00ff7f;
animation:pulse 1s infinite;
}

.status-idle{
color:#ff9800;
}

@keyframes pulse{
0%{opacity:.4;}
50%{opacity:1;}
100%{opacity:.4;}
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.top{
padding:20px;
border-bottom:1px solid rgba(255,255,255,.08);
}

textarea{
width:100%;
height:120px;
background:#101826;
border:none;
border-radius:12px;
padding:15px;
color:white;
resize:none;
font-size:15px;
}

.controls{
margin-top:15px;
display:flex;
gap:12px;
}

button{
border:none;
cursor:pointer;
padding:12px 18px;
border-radius:10px;
font-weight:700;
}

.start{
background:#0ea5e9;
color:white;
}

.kill{
background:#ff5722;
color:white;
animation:pulse 1s infinite;
}

.api{
background:#673ab7;
color:white;
}

.chat{
flex:1;
overflow:auto;
padding:20px;
}

.msg{
max-width:80%;
padding:14px;
border-radius:14px;
margin-bottom:16px;
line-height:1.5;
}

.ai1{
background:#16324f;
}

.ai2{
background:#3b1d4d;
margin-left:auto;
}

.name{
font-size:13px;
opacity:.7;
margin-bottom:6px;
}

.modal{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.65);
backdrop-filter:blur(10px);
}

.modal-box{
background:#111827;
padding:25px;
width:400px;
border-radius:16px;
}

.modal input{
width:100%;
padding:12px;
margin-top:10px;
background:#1f2937;
border:none;
color:white;
border-radius:10px;
}

.modal button{
margin-top:15px;
width:100%;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<div class="logo">AlterX</div>

<div class="card">
<h3>Sandbox Status</h3>
<p id="status" class="status-idle">● INACTIVE</p>
</div>

<div class="card">
<h3>API Status</h3>
<p id="apiStatus">✕ NOT CONFIGURED</p>
</div>

<div class="card">
<h3>Active Speaker</h3>
<p id="speaker">Waiting...</p>
</div>

<div class="card">
<h3>Safety Shield</h3>
<p>Local Runtime Environment</p>
</div>

</div>

<div class="main">

<div class="top">

<textarea id="topic"
placeholder="Enter app idea, coding challenge, science problem..."></textarea>

<div class="controls">

<button id="startBtn" class="start">
START LOOP
</button>

<button id="apiBtn" class="api">
SET API KEY
</button>

</div>

</div>

<div class="chat" id="chat"></div>

</div>

</div>

<div class="modal" id="modal">

<div class="modal-box">

<h2>Gemini API Key</h2>

<input
type="password"
id="apiInput"
placeholder="Paste API Key">

<button class="api" id="saveApi">
Save Key
</button>

</div>

</div>

<script>

const chat=document.getElementById("chat");
const startBtn=document.getElementById("startBtn");
const topic=document.getElementById("topic");
const status=document.getElementById("status");
const speaker=document.getElementById("speaker");

let running=false;

function addMessage(name,text,type){

const div=document.createElement("div");
div.className="msg "+type;

div.innerHTML=
`
<div class="name">${name}</div>
<div>${text}</div>
`;

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;
}

function sleep(ms){
return new Promise(r=>setTimeout(r,ms));
}

async function loop(){

const topicText=topic.value.trim();

if(!topicText){
alert("Enter topic");
return;
}

running=true;

topic.disabled=true;

status.innerHTML="● LIVE";
status.className="status-live";

startBtn.innerText="KILL SWITCH";
startBtn.className="kill";

let round=1;

while(running){

speaker.innerText="AlterX-1";

await sleep(1200);

addMessage(
"AlterX-1",
`Round ${round}: Creative proposal for "${topicText}". 

I propose a futuristic architecture using distributed AI agents, adaptive memory layers, autonomous planning and scalable cloud orchestration.`,
"ai1"
);

if(!running) break;

speaker.innerText="AlterX-2";

await sleep(1500);

addMessage(
"AlterX-2",
`Optimization Review:

Potential bottlenecks detected:
• Cost scaling
• Latency
• Memory overflow

Recommendation:
Use compressed context windows, edge inference and caching.`,
"ai2"
);

round++;

await sleep(1200);
}

speaker.innerText="Stopped";
}

function stopLoop(){

running=false;

topic.disabled=false;

status.innerHTML="● INACTIVE";
status.className="status-idle";

startBtn.innerText="START LOOP";
startBtn.className="start";
}

startBtn.addEventListener("click",()=>{

if(!running){
loop();
}else{
stopLoop();
}

});

const modal=document.getElementById("modal");

document.getElementById("apiBtn")
.onclick=()=>{
modal.style.display="flex";
};

document.getElementById("saveApi")
.onclick=()=>{

const key=
document.getElementById("apiInput").value;

localStorage.setItem(
"alterx_api_key",
key
);

document.getElementById("apiStatus")
.innerHTML="✓ CONFIGURED";

modal.style.display="none";
};

if(localStorage.getItem("alterx_api_key")){
document.getElementById("apiStatus")
.innerHTML="✓ CONFIGURED";
}

</script>

</body>
    </html>
