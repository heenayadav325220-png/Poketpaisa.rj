<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORE AI Robot</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:radial-gradient(circle,#111,#000);
font-family:Arial,sans-serif;
overflow:hidden;
}

.robot{
width:340px;
height:420px;
background:linear-gradient(145deg,#1f1f1f,#0a0a0a);
border-radius:40px;
position:relative;
border:3px solid #333;
box-shadow:
0 0 30px rgba(0,255,255,.25),
inset 0 0 20px rgba(255,255,255,.05);
animation:float 4s ease-in-out infinite;
}

@keyframes float{
50%{transform:translateY(-10px);}
}

.forehead{
position:absolute;
top:25px;
left:50%;
transform:translateX(-50%);
width:90px;
height:10px;
border-radius:20px;
background:#00ffff;
box-shadow:0 0 20px #00ffff;
}

.eyes{
position:absolute;
top:110px;
width:100%;
display:flex;
justify-content:center;
gap:50px;
}

.eye{
width:90px;
height:90px;
background:#050505;
border:2px solid #00ffff;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 20px #00ffff;
overflow:hidden;
}

.pupil{
width:28px;
height:28px;
background:#00ffff;
border-radius:50%;
box-shadow:0 0 20px #00ffff;
animation:look 5s infinite;
}

@keyframes look{
0%,100%{transform:translateX(0);}
25%{transform:translateX(12px);}
50%{transform:translateX(-12px);}
75%{transform:translateY(8px);}
}

.mouth{
position:absolute;
bottom:90px;
left:50%;
transform:translateX(-50%);
width:140px;
height:14px;
background:#00ffff;
border-radius:20px;
box-shadow:0 0 20px #00ffff;
animation:talk 1s infinite;
}

@keyframes talk{
50%{
width:90px;
}
}

.core{
position:absolute;
bottom:25px;
left:50%;
transform:translateX(-50%);
width:70px;
height:70px;
border-radius:50%;
background:#00ffff;
box-shadow:
0 0 20px #00ffff,
0 0 50px #00ffff,
0 0 90px #00ffff;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{
transform:translateX(-50%) scale(1.15);
}
}

.status{
position:absolute;
bottom:-55px;
width:100%;
text-align:center;
color:#00ffff;
font-weight:bold;
font-size:18px;
text-shadow:0 0 10px #00ffff;
}

.scan{
position:absolute;
width:100%;
height:6px;
background:rgba(0,255,255,.8);
top:0;
box-shadow:0 0 20px cyan;
animation:scan 4s linear infinite;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}
</style>
</head>
<body>

<div class="robot">

<div class="scan"></div>

<div class="forehead"></div>

<div class="eyes">
<div class="eye">
<div class="pupil"></div>
</div>

<div class="eye">
<div class="pupil"></div>
</div>
</div>

<div class="mouth"></div>

<div class="core"></div>

<div class="status">
CORE AI ONLINE
</div>

</div>

</body>
</html>
