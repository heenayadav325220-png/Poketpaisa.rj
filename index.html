<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CorBat AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- टॉप बार (Control Panel) -->
    <div class="top-bar">
        <h1 class="logo">CorBat <span>AI</span></h1>
        <div id="bt-status" class="bt-dot disconnected"></div>
    </div>

    <!-- मिडिल सेक्शन (Dashboard) -->
    <div class="dashboard">
        <div class="speed-container">
            <div class="speed-value" id="speed-display">00</div>
            <div class="speed-unit">km/h</div>
        </div>
        
        <div class="shot-status" id="shot-quality">READY TO HIT</div>
    </div>

    <!-- बॉटम सेक्शन (Action Buttons) -->
    <div class="action-area">
        <!-- जादुई फ्री डाउनलोड बटन -->
        <button id="download-btn" class="btn btn-download">
            📥 DOWNLOAD CorBat APP (FREE)
        </button>
        
        <!-- व्हाट्सएप शेयर बटन -->
        <button id="share-btn" class="btn btn-share">
            🔗 SHARE WITH FRIENDS
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
