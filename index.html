<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tesla 2030 Concept</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#050816;
color:#fff;
overflow:hidden;
}

.screen{
position:absolute;
width:100%;
height:100vh;
padding:20px;
display:none;
overflow:auto;
}

.active{
display:block;
}

.glass{
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.1);
border-radius:25px;
padding:20px;
margin-bottom:20px;
}

.logo{
font-size:32px;
font-weight:bold;
letter-spacing:8px;
color:#00e5ff;
margin-bottom:20px;
}

.car{
width:100%;
height:220px;
border-radius:20px;
background:linear-gradient(90deg,#00e5ff,#00ff88);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
font-weight:bold;
color:#000;
}

.stat{
display:flex;
justify-content:space-between;
margin-top:10px;
}

.big{
font-size:42px;
font-weight:bold;
color:#00ff88;
}

.bar{
height:12px;
background:#111;
border-radius:20px;
overflow:hidden;
margin-top:15px;
}

.fill{
height:100%;
width:89%;
background:linear-gradient(90deg,#00ff88,#00e5ff);
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.card{
background:rgba(255,255,255,.04);
padding:20px;
border-radius:20px;
text-align:center;
}

.card h2{
color:#00e5ff;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#08111f;
display:flex;
justify-content:space-around;
align-items:center;
border-top:1px solid rgba(255,255,255,.1);
}

.nav button{
background:none;
border:none;
color:white;
font-size:16px;
cursor:pointer;
}

.speed{
font-size:90px;
text-align:center;
color:#00e5ff;
text-shadow:0 0 30px #00e5ff;
}

.lane{
height:320px;
position:relative;
overflow:hidden;
border-radius:20px;
background:#000;
}

.lane::before{
content:'';
position:absolute;
left:50%;
width:6px;
height:100%;
background:linear-gradient(transparent,#fff,transparent);
animation:road 1s linear infinite;
}

@keyframes road{
from{transform:translateY(-100%);}
to{transform:translateY(100%);}
}

.ai{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
width:90px;
height:150px;
background:#00e5ff;
border-radius:20px;
box-shadow:0 0 30px #00e5ff;
}

.chart{
height:220px;
display:flex;
align-items:flex-end;
gap:10px;
}

.col{
flex:1;
background:linear-gradient(#00e5ff,#00ff88);
border-radius:10px 10px 0 0;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{opacity:.4}
to{opacity:1}
}

</style>
</head>
<body>

<!-- DASHBOARD -->

<div class="screen active" id="home">

<div class="logo">TESLA</div>

<div class="glass">

<div class="car">
MODEL X 2030
</div>

<div class="stat">
<h3>Battery</h3>
<h3>89%</h3>
</div>

<div class="bar">
<div class="fill"></div>
</div>

<div class="stat" style="margin-top:15px;">
<div>
<p>Range</p>
<div class="big">520km</div>
</div>

<div>
<p>Status</p>
<div class="big">READY</div>
</div>
</div>

</div>

<div class="grid">

<div class="card">
<h2>22°C</h2>
<p>Climate</p>
</div>

<div class="card">
<h2>ON</h2>
<p>Security</p>
</div>

<div class="card">
<h2>AI</h2>
<p>Autopilot</p>
</div>

<div class="card">
<h2>GPS</h2>
<p>Navigation</p>
</div>

</div>

</div>

<!-- AUTOPILOT -->

<div class="screen" id="auto">

<div class="logo">AUTOPILOT</div>

<div class="glass">

<div class="speed">87</div>

<center>KM/H</center>

<br>

<div class="lane">
<div class="ai"></div>
</div>

</div>

</div>

<!-- BATTERY -->

<div class="screen" id="battery">

<div class="logo">BATTERY AI</div>

<div class="glass">

<h2>Battery Analytics</h2>

<br>

<div class="chart">

<div class="col" style="height:60%"></div>
<div class="col" style="height:85%"></div>
<div class="col" style="height:45%"></div>
<div class="col" style="height:100%"></div>
<div class="col" style="height:70%"></div>
<div class="col" style="height:90%"></div>

</div>

<br>

<h1 style="color:#00ff88">89%</h1>

<p>Battery Health Excellent</p>

<br>

<div class="bar">
<div class="fill"></div>
</div>

</div>

</div>

<div class="nav">

<button onclick="show('home')">Dashboard</button>

<button onclick="show('auto')">Autopilot</button>

<button onclick="show('battery')">Battery</button>

</div>

<script>

function show(id){

document.querySelectorAll('.screen')
.forEach(s=>s.classList.remove('active'));

document.getElementById(id)
.classList.add('active');

}

</script>

</body>
</html>
